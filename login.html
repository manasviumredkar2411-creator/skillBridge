<html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillBridge | Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    color:white;

    background:
    radial-gradient(
        circle at 75% 20%,
        rgba(255,255,255,0.65),
        rgba(180,185,190,0.18) 25%,
        transparent 45%
    ),
    linear-gradient(
        120deg,
        #030303,
        #101010,
        #25282b,
        #73787d
    );

    background-attachment:fixed;
}


/* NAVBAR */

nav{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7%;

    background:rgba(8,8,8,0.94);

    border-bottom:1px solid rgba(255,255,255,0.18);

    box-shadow:0 2px 15px rgba(0,0,0,0.4);
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:1px;
}

.logo span{
    color:#d9dde1;
}

.home-btn{
    color:#ddd;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
}

.home-btn:hover{
    color:#fff;
}


/* MAIN */

.login-section{
    min-height:calc(100vh - 70px);

    display:flex;
    justify-content:center;
    align-items:center;

    padding:45px 20px;
}


/* LOGIN CARD */

.login-card{
    width:90%;
    max-width:700px;

    padding:38px 40px;

    background:rgba(10,10,10,0.88);

    border:1px solid rgba(255,255,255,0.25);

    border-radius:18px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.55);

    animation:appear 0.7s ease;
}


/* TITLE */

.title{
    text-align:center;
    margin-bottom:28px;
}

.title h1{
    font-size:34px;
    margin-bottom:10px;
}

.title h1 span{
    color:#d9dde1;
}

.title p{
    color:#bbb;
    font-size:14px;
}


/* FORM */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    color:#ddd;

    font-size:14px;

    font-weight:bold;
}

.form-group input{
    width:100%;

    padding:13px;

    background:#171717;

    color:white;

    border:1px solid #555;

    border-radius:8px;

    outline:none;

    font-size:14px;

    transition:0.3s;
}

.form-group input::placeholder{
    color:#777;
}

.form-group input:focus{
    border-color:#d9dde1;

    box-shadow:
        0 0 10px rgba(220,225,230,0.15);
}


/* TWO INPUTS */

.form-row{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:18px;
}


/* PASSWORD */

.password-box{
    position:relative;
}

.password-box input{
    padding-right:50px;
}

.show-password{
    position:absolute;

    right:14px;

    top:50%;

    transform:translateY(-50%);

    border:none;

    background:none;

    color:#aaa;

    cursor:pointer;

    font-size:17px;
}


/* LOGIN OPTIONS */

.login-options{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin:2px 0 22px;

    font-size:13px;
}

.remember{

    display:flex;

    align-items:center;

    gap:7px;

    color:#aaa;
}

.remember input{
    width:15px;
    height:15px;
}

.forgot{

    color:#d9dde1;

    text-decoration:none;

    font-weight:bold;
}

.forgot:hover{
    text-decoration:underline;
}


/* LOGIN BUTTON */

.login-button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:9px;

    background:#d9dde1;

    color:#111;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.login-button:hover{

    background:#fff;

    transform:translateY(-3px);

    box-shadow:
        0 10px 25px rgba(220,225,230,0.28);
}


/* MESSAGE */

.message{

    display:none;

    margin-top:18px;

    padding:12px;

    text-align:center;

    border-radius:8px;

    background:#181818;

    border:1px solid #555;

    color:#ddd;

    font-size:13px;
}


/* CREATE PROFILE */

.create-profile{

    text-align:center;

    margin-top:24px;

    color:#999;

    font-size:14px;
}

.create-profile a{

    color:#d9dde1;

    text-decoration:none;

    font-weight:bold;
}

.create-profile a:hover{
    text-decoration:underline;
}


/* ANIMATION */

@keyframes appear{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* MOBILE */

@media(max-width:600px){

    .login-card{
        width:94%;
        padding:28px 20px;
    }

    .form-row{
        grid-template-columns:1fr;
        gap:0;
    }

    .title h1{
        font-size:29px;
    }

    .login-options{
        font-size:12px;
    }

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav>

    <div class="logo">

        Skill<span>Bridge</span>

    </div>


    <a
        href="index.html"
        class="home-btn">

        ← Home

    </a>

</nav>



<!-- LOGIN PAGE -->

<section class="login-section">


    <div class="login-card">


        <!-- TITLE -->

        <div class="title">

            <h1>
                Welcome <span>Back</span>
            </h1>

            <p>
                Login to your SkillBridge student account.
            </p>

        </div>



        <form id="loginForm">


            <!-- EMAIL + MOBILE -->

            <div class="form-row">


                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter mobile number"
                        maxlength="10"
                        required>

                </div>


            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label>
                    Password
                </label>


                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        minlength="4">


                    <button
                        type="button"
                        class="show-password"
                        id="showPassword">

                        👁

                    </button>

                </div>

            </div>



            <!-- REMEMBER / FORGOT -->

            <div class="login-options">


                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember">

                    Remember me

                </label>


                <a
                    href="#"
                    class="forgot"
                    id="forgot">

                    Forgot Password?

                </a>


            </div>



            <!-- LOGIN -->

            <button
                type="submit"
                class="login-button">

                Login

            </button>


        </form>



        <!-- MESSAGE -->

        <div
            class="message"
            id="message">

        </div>



        <!-- CREATE PROFILE -->

        <div class="create-profile">

            Don't have an account?

            <a href="profile.html">

                Create Profile

            </a>

        </div>


    </div>

</section>



<script>


/* SHOW / HIDE PASSWORD */

document
.getElementById("showPassword")
.addEventListener("click",function(){

    const password =
    document.getElementById("password");


    if(password.type === "password"){

        password.type = "text";

        this.innerHTML = "🙈";

    }

    else{

        password.type = "password";

        this.innerHTML = "👁";

    }

});



/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit",function(e){

    e.preventDefault();


    const email =
    document.getElementById("email")
    .value
    .trim();


    const mobile =
    document.getElementById("mobile")
    .value
    .trim();


    const password =
    document.getElementById("password")
    .value;


    const message =
    document.getElementById("message");


    /* Check profile */

    const savedProfile =
    localStorage.getItem(
        "skillBridgeProfile"
    );


    if(!savedProfile){

        message.style.display="block";

        message.innerHTML=
        "⚠️ Please create your profile first.";

        return;

    }


    const profile =
    JSON.parse(savedProfile);


    /* Check email */

    const emailMatch =
    profile.email &&
    email.toLowerCase() ===
    profile.email.toLowerCase();


    /* Check mobile */

    const mobileMatch =
    profile.phone &&
    mobile === profile.phone;


    if(!emailMatch){

        message.style.display="block";

        message.innerHTML=
        "❌ Email does not match your profile.";

        return;

    }


    if(!mobileMatch){

        message.style.display="block";

        message.innerHTML=
        "❌ Mobile number does not match your profile.";

        return;

    }


    if(password.length < 4){

        message.style.display="block";

        message.innerHTML=
        "⚠️ Please enter a valid password.";

        return;

    }


    /* Successful login */

    localStorage.setItem(
        "skillBridgeLoggedIn",
        "true"
    );


    if(
        document.getElementById("remember").checked
    ){

        localStorage.setItem(
            "skillBridgeRemember",
            "true"
        );

    }


    message.style.display="block";

    message.innerHTML=
    "✅ Login successful!";

setTimeout(function(){

window.location.href="dashboard.html";

},800);


});



/* FORGOT PASSWORD */

document
.getElementById("forgot")
.addEventListener("click",function(e){

    e.preventDefault();


    const message =
    document.getElementById("message");


    message.style.display="block";

    message.innerHTML=
    "ℹ️ Password reset will be connected with email verification.";

});

</script>


</body>

</html>
