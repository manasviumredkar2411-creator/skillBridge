<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge | Admin Dashboard</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #080808;
        color: #eee;
        padding: 24px;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        padding-bottom: 22px;
        margin-bottom: 30px;
        border-bottom: 1px solid #555;
    }

    h1 {
        color: #ddd;
    }

    .subtitle {
        color: #999;
        margin-top: 8px;
    }

    .button {
        display: inline-block;
        padding: 10px 16px;
        margin-left: 6px;
        border: 1px solid #bbb;
        border-radius: 5px;
        background: #ddd;
        color: #111;
        text-decoration: none;
        cursor: pointer;
        font-weight: bold;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 18px;
        margin-bottom: 35px;
    }

    .card {
        background: #151515;
        border: 1px solid #555;
        border-radius: 10px;
        padding: 23px;
    }

    .card p {
        color: #aaa;
        font-size: 14px;
    }

    .card h2 {
        font-size: 32px;
        margin-top: 12px;
        color: #eee;
    }

    h3 {
        margin-bottom: 18px;
    }

    #message {
        color: #bbb;
        margin-bottom: 15px;
    }

    .table-container {
        overflow-x: auto;
        border: 1px solid #444;
        border-radius: 8px;
    }

    table {
        width: 100%;
        min-width: 600px;
        border-collapse: collapse;
        background: #141414;
    }

    th, td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #333;
    }

    th {
        background: #252525;
        color: #eee;
    }

    td {
        color: #ccc;
    }

    @media (max-width: 600px) {
        body {
            padding: 14px;
        }

        .button {
            margin-top: 12px;
        }
    }
</style>

</head><body><header>
    <div>
        <h1>SkillBridge</h1>
        <p class="subtitle">Admin Dashboard</p>
    </div>

    <div>
        <button class="button" onclick="loadDashboard()">
            Refresh
        </button>

        <a class="button" href="index.html">Home</a>
    </div>
</header>

<section class="cards">
    <div class="card">
        <p>Total Applications</p>
        <h2 id="total-count">—</h2>
    </div>

    <div class="card">
        <p>Frontend Developer</p>
        <h2 id="frontend-count">—</h2>
    </div>

    <div class="card">
        <p>Data Analyst</p>
        <h2 id="data-count">—</h2>
    </div>

    <div class="card">
        <p>UI/UX Designer</p>
        <h2 id="uiux-count">—</h2>
    </div>
</section>

<section>
    <h3>Student Applications</h3>

    <p id="message">Loading applications...</p>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Email</th>
                    <th>Contact Number</th>
                    <th>Internship Title</th>
                    
                </tr>
            </thead>

            <tbody id="applications-table"></tbody>
        </table>
    </div>
</section>

<script src="admin.js"></script>

</body>
</html>
